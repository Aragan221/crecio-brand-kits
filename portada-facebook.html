<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portada Facebook · Creció</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    padding: 40px 16px; font-family: 'Montserrat', sans-serif;
  }

  /* Lienzo exacto de portada de Facebook (1640 x 856) */
  .cover {
    width: 1640px; height: 856px;
    background: #0D0D0D; position: relative; overflow: hidden;
  }

  /* Glows de marca, centrados arriba (donde va el texto) */
  .cover::before {
    content:""; position:absolute; width:1300px; height:1300px;
    left:50%; top:-55%; transform:translateX(-50%);
    background: radial-gradient(circle, rgba(124,58,237,0.42) 0%, rgba(124,58,237,0) 60%);
  }
  .cover::after {
    content:""; position:absolute; width:700px; height:700px;
    right:-150px; top:-100px;
    background: radial-gradient(circle, rgba(168,85,247,0.22) 0%, rgba(168,85,247,0) 62%);
  }

  /* CONTENIDO en la franja SUPERIOR-CENTRAL:
     - Visible en computador (que muestra la banda central)
     - Por ENCIMA de la foto de perfil (que tapa el centro-abajo) */
  .content {
    position: absolute; z-index: 2;
    top: 300px;                 /* sube el texto sobre el circulo de perfil */
    left: 50%; transform: translate(-50%, -50%);
    width: 1200px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }

  .kicker {
    font-size: 22px; font-weight: 700; letter-spacing: 5px;
    text-transform: uppercase; color: #A855F7; margin-bottom: 22px;
  }

  h1 {
    font-size: 72px; line-height: 1.06; font-weight: 900;
    color: #FFFFFF; letter-spacing: -1px;
  }
  h1 .hl { color: #7C3AED; }

  .label { color:#888; font-size:14px; font-weight:600; text-align:center; max-width:1640px; }
</style>
</head>
<body>

  <div class="label">
    📐 1640×856 px · El texto va en la franja SUPERIOR-CENTRAL para quedar por
    ENCIMA de la foto de perfil (que tapa el centro-abajo). Exporta solo el recuadro negro (.cover).
  </div>

  <div class="cover" id="cover">
    <div class="content">
      <span class="kicker">Marca personal · Marketing · IA</span>
      <h1>Convertimos tu conocimiento<br>en <span class="hl">clientes</span></h1>
    </div>
  </div>

</body>
</html>
